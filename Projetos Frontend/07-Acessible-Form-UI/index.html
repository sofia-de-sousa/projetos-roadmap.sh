<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Acessible Form UI</title>
    </head>
    <body>
        <main>
            <div class="main-container">
                <!-- Form -->
                <form action="#" method="post">
                    <!-- Full Name -->
                    <div class="form-field">
                        <label for="full-name">Full Name</label>
                        <input type="text" name="full-name" id="full-name" placeholder="What should we call you?" aria-required="true">
                    </div>

                    <!-- Email -->
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" placeholder="What is your email?" aria-required="true" aria-invalid="true">
                        <span class="error-message">Email is already taken</span>
                    </div>

                    <!-- Password -->
                    <div class="form-field">
                        <label for="enter-password">Enter Password</label>
                        <div class="password-container">
                            <input type="password" name="enter-password" id="enter-password" placeholder="xxxxxxxx" aria-required="true">
                            <button type="button" aria-label="Password is hidden" aria-pressed="false">Show</button>
                        </div>
                    </div>
                    
                    <!-- Confirm Password -->
                    <div class="form-field">
                        <label for="confirm-password">Confirm Password</label>
                        <div class="password-container">
                            <input type="password" name="confirm-password" id="confirm-password" placeholder="xxxxxxxx" aria-required="true">
                            <button type="button" aria-label="Password is hidden" aria-pressed="false">Show</button>
                        </div>
                    </div>

                    <!-- Button -->
                    <button type="submit">Update Profile</button>
                </form>

                <!-- Profile Completeness -->
                <div class="profile-completeness">
                    <!-- Progress Bar -->
                    <div class="profile-progress">
                        <span>65%</span>
                        <progress id="progress-bar" value="65" max="100">65%</progress>
                    </div>
                    <p>Profile Completeness</p>

                    <!-- Checklist -->
                    <div class="checklist-box">
                        <ul>
                            <li class="task-completed">Create Account</li>
                            <li class="task-completed">Update Roadmap Features</li>
                            <li class="task-completed">Setup Public Profile</li>
                            <li>Complete your first project</li>
                            <li>Invite your Friends</li>
                        </ul>
                    </div>
                </div>
            </div>   
        </main>
    </body>
</html>
