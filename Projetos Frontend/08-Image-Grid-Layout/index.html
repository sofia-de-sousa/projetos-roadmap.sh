<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Image Grid Layout</title>
    </head>
    <body>
        <div class="grid-container">
            <div class="img-container">
                <img src="../Assets/Imagens/grid-img-1.jpg" alt="A foggy beach with a large rock formation in the foreground" class="vertical-img">
                <img src="../Assets/Imagens/grid-img-2.jpg" alt="A living room with a white couch and a round window" class="horizontal-img">
            </div>
            <div class="img-container">
                <img src="../Assets/Imagens/grid-img-3.jpg" alt="A table topped with plates and bowls of food" class="horizontal-img">
                <img src="../Assets/Imagens/grid-img-4.jpg" alt="A building with a red door and a tree in front of it" class="vertical-img">
            </div>
            <div class="img-container">
                <img src="../Assets/Imagens/grid-img-5.jpg" alt="A row of white apartment buildings next to a street" class="vertical-img">
                <img src="../Assets/Imagens/grid-img-6.jpg" alt="A view of a beach from the top of a hill" class="horizontal-img">
            </div>
        </div>
    </body>
</html>
